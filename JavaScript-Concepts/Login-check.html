<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>
<body>
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Enter Username">
    <br><br>
    <input type="password" id="password" placeholder="Enter a strong password">
    <br><br>
    <button onclick="login()">Login</button>

    <p id="result">Login result?</p>

    <script>
    function login()
    {
        let username = document.getElementById("username").value;
        let password = document.getElementById("password").value;
        let result = document.getElementById("result");

        // document.getElementById("result").innerHTML = username + " " + password;

        if(username=="soniya" && password=="sonu")
        {
            result.style.color="green";
            result.innerHTML = "<h1>Login Succesfull!!!</h1>";
        }
        else
        {
             result.style.color="red";
            result.innerHTML = "Invalid Credentials!!!";
        }
    }
    </script>
</body>
</html>
