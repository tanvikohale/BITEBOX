    <script>
        function print_for_loop(){

            let num = Number(document.getElementById("num").value);
            let output = "";

            for(let i=1; i<=num; i++){
                if(i%2==0){
                    output=output+i + "<br>"; 
                }     
            }
            document.getElementById("result").innerHTML=output;
        }
    </script>
</body>
