<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Day</title>
</head>
<body>
    <h2>Find the day of the week</h2>

    <input type="text" id="day" placeholder="Enter any Number from 1 to 7">
    <br><br>
    <button onclick="showDay()">Check Day</button>
    <p id="result"></p>


    <!-- Script starts here -->
     <script>

        function showDay(){

            let day = Number(document.getElementById("day").value);
            let result = document.getElementById("result");

            switch(day)
            {
                case 1 : result.innerHTML = "Monday";
                break;

                case 2 : result.innerHTML = "Tuesday";
                break;

                case 3 : result.innerHTML = "Wednesday";
                break;

                case 4 : result.innerHTML = "Thursday";
                break;

                case 5 : result.innerHTML = "Friday";
                break;

                case 6 : result.innerHTML = "Saturday";
                break;

                case 7 : result.innerHTML = "Sunday";
                break;

                default : result.innerHTML = "Invalid Input!! Please enter a number between 1 to 7";
                break;   
            }
        }
     </script>
</body>
</html>
